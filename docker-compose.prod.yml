# AP Automation: server settings, layered on docker-compose.yml.
# On the server, .env sets COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml, so every
# `docker compose` command (and the scripts) uses both files. See docs/deployment.md.
#
# Nothing of n8n is served on the internet: its editor, sign-in and OAuth callback are reached
# through an SSH tunnel, like the review page. Caddy is the only service published on the public
# interface (80/443); it serves the home page's static files, forwards the demo pages (demo-web) and
# no n8n route (deploy/Caddyfile).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *logging

  n8n:
    environment:
      # Editor through the tunnel: ssh -N -L 5679:127.0.0.1:5678 <server>, then http://localhost:5679.
      # The OAuth redirect URL follows it: http://localhost:5679/rest/oauth2-credential/callback
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      # Webhooks are only reachable on the server itself (scripts/run_now.py's default URL)
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "true"   # browsers accept secure cookies on http://localhost
    # Measured on the server: about 630 MB right after start (Node heap capped at 512 MB by
    # NODE_OPTIONS, plus native memory, binary buffers and the task runner process).
    mem_limit: 1g
    logging: *logging

  core:
    logging: *logging

  review-web:
    logging: *logging

  # Public demo pages, behind Caddy: on Caddy's network too (Caddy reaches nothing else). Only Caddy's
  # X-Forwarded-For names the client, for the per-address limits.
  demo-web:
    environment:
      DEMO_ORIGINS: ${DEMO_ORIGINS:?set DEMO_ORIGINS in .env (e.g. https://demo.davidmichel.dev)}
      DEMO_TRUSTED_PROXIES: 172.29.250.10   # caddy, below
    logging: *logging
    networks: [backend, frontend]

  # HTTPS front door. Certificates from Let's Encrypt, renewed automatically. It sits alone on
  # its own network: it can't reach n8n, the database, the core or the review page.
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      RETIRED_HOSTS: ${RETIRED_HOSTS:?set RETIRED_HOSTS in .env}
      DEMO_HOST: ${DEMO_HOST:?set DEMO_HOST in .env}
      HOME_HOST: ${HOME_HOST:?set HOME_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SITE_DIR:-../davidmichel.dev/public}:/srv/site:ro   # the home page's files (site repository)
      - caddy_data:/data       # certificates and ACME account: keep it, or Let's Encrypt limits may apply
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging: *logging
    networks:
      frontend:
        ipv4_address: 172.29.250.10   # fixed: demo-web trusts this address's X-Forwarded-For

volumes:
  caddy_data:
  caddy_config:

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.29.250.0/24
