{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block main %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Review of invoices that need a person: approve, correct or reject them before they are posted to QuickBooks.</p>
  {% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email <input type="email" name="email" autocomplete="username" required maxlength="254" autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required maxlength="128"></label>
    <button class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
