<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Review{% endblock %} | AP review</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/items">AP review</a>
  {% if viewer %}
  <div class="who">
    <span class="who-name">{{ viewer.display_name }}</span>
    <span class="who-role">{{ viewer.role | capitalize }}, <span class="scope {{ data_label[1] }}">{{ data_label[0] }}</span></span>
  </div>
  <form method="post" action="/logout" class="signout">
    <input type="hidden" name="csrf" value="{{ viewer.csrf }}">
    <button class="quiet">Sign out</button>
  </form>
  {% endif %}
</header>
<main>{% block main %}{% endblock %}</main>
<footer class="foot"><a href="https://davidmichel.dev">© David Michel</a></footer>
</body>
</html>
