<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Review{% endblock %} · AP review</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/items">AP review</a>
  {% if viewer %}
  <span class="who">{{ viewer.display_name }} · {{ viewer.role }} · <span class="tag scope-{{ viewer.scope }}">{{ viewer.scope }} data</span></span>
  <form method="post" action="/logout" class="inline">
    <input type="hidden" name="csrf" value="{{ viewer.csrf }}">
    <button class="link">Sign out</button>
  </form>
  {% endif %}
</header>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
