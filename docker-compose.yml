# AP Automation: local stack (n8n + PostgreSQL + Python core service).
# All secrets come from .env (see .env.example). Only n8n is published, on localhost.

name: ap-automation

services:
  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      # Read by db/init/00_roles.sh on first start only
      N8N_DB_NAME: ${N8N_DB_NAME}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      AP_DB_USER: ${AP_DB_USER}
      AP_DB_PASSWORD: ${AP_DB_PASSWORD}
    volumes:
      - pg17_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    # No host port. If ever needed for a local SQL client, uncomment (5432-5434 are taken):
    # ports:
    #   - "127.0.0.1:5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${N8N_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m
    networks: [backend]

  n8n:
    image: n8nio/n8n:2.48.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"          # local http only; true behind HTTPS (Caddy)
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336        # hours (14 days)
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}  # debug shows every trigger poll
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows   # used by scripts/export_workflows.sh
    mem_limit: 768m
    networks: [backend]

  core:
    build:
      context: ./services/core
      target: runtime
    image: ap-automation/core:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AP_DATABASE_URL: postgresql://${AP_DB_USER}:${AP_DB_PASSWORD}@postgres:5432/${N8N_DB_NAME}
      CORE_API_TOKEN: ${CORE_API_TOKEN}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD}
      CUTOFF_MATERIALITY: ${CUTOFF_MATERIALITY:-1000}
      CAPEX_THRESHOLD: ${CAPEX_THRESHOLD:-2500}
      HOME_CURRENCY: ${HOME_CURRENCY}
      INTAKE_EMAIL_ALIAS: ${INTAKE_EMAIL_ALIAS:-invoices@davidmichel.dev}
      FILE_STORAGE_DIR: /data/files
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS}
      BANK_FINGERPRINT_KEY: ${BANK_FINGERPRINT_KEY:-}   # required: processing refuses to run without it
      # Accounting accounts (QuickBooks IDs) and matching rules, see docs/matching.md
      QBO_REALM_ID: ${QBO_REALM_ID:-}
      QBO_API_HOST: ${QBO_API_HOST:-https://sandbox-quickbooks.api.intuit.com}
      QBO_WITHHOLDING_ACCOUNT_ID: ${QBO_WITHHOLDING_ACCOUNT_ID:-}
      QBO_TAX_RECOVERABLE_ACCOUNT_ID: ${QBO_TAX_RECOVERABLE_ACCOUNT_ID:-}
      TAX_TREATMENT_FILE: ${TAX_TREATMENT_FILE:-}
      QBO_BANK_ACCOUNT_ID: ${QBO_BANK_ACCOUNT_ID:-35}
      QBO_WRITE_OFF_ACCOUNT_ID: ${QBO_WRITE_OFF_ACCOUNT_ID:-}  # "Payment differences" (scripts/create_chart_of_accounts.py)
      RUN_NOW_TOKEN: ${RUN_NOW_TOKEN:-}  # empty: every "Run now" request is refused
      MATCH_AMOUNT_ABS_TOLERANCE: ${MATCH_AMOUNT_ABS_TOLERANCE:-1.00}
      MATCH_AMOUNT_PCT_TOLERANCE: ${MATCH_AMOUNT_PCT_TOLERANCE:-0.005}
      MATCH_DAYS_BEFORE_INVOICE: ${MATCH_DAYS_BEFORE_INVOICE:-3}
      MATCH_DAYS_AFTER_DUE: ${MATCH_DAYS_AFTER_DUE:-30}
      MATCH_NAME_MIN_SIMILARITY: ${MATCH_NAME_MIN_SIMILARITY:-0.6}
    volumes:
      - ap_files:/data/files     # original invoice files, core service only
    # Internal only: reachable from n8n at http://core:8000
    expose:
      - "8000"
    mem_limit: 200m
    networks: [backend]

  # Review page, internal listener: every role may sign in. Published on the host's loopback only;
  # on a server it is reached through an SSH tunnel (docs/security.md), never through the proxy.
  # Same image as the core, but only the browser routes: no machine API, no API token, no OCR key.
  review-web:
    build:
      context: ./services/core
      target: runtime
    image: ap-automation/core:dev
    restart: unless-stopped
    command: ["uvicorn", "--factory", "app.web.main:create_app", "--host", "0.0.0.0", "--port", "8081",
              "--workers", "1", "--no-proxy-headers", "--no-server-header"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AP_DATABASE_URL: postgresql://${AP_DB_USER}:${AP_DB_PASSWORD}@postgres:5432/${N8N_DB_NAME}
      FILE_STORAGE_DIR: /data/files
      REVIEW_LISTENER: internal
      REVIEW_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD}          # the core's review threshold: the badge turns red below it
      REVIEW_CONFIDENCE_HIGH: ${REVIEW_CONFIDENCE_HIGH:-0.95}
      REVIEW_ENVIRONMENT: ${REVIEW_ENVIRONMENT:-production}  # "test" on a test database: the header says so
    volumes:
      - ap_files:/data/files     # page images are rendered from the stored originals; a rejection deletes one
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 256m
    networks: [backend]

  # Unit tests: docker compose run --rm --build core-test
  # Live Mistral smoke test (costs a few cents): docker compose run --rm core-test pytest -m live
  # Type check (mypy) of the whole repo with the core's exact Python and libraries.
  # Run by the pre-commit hook; by hand: docker compose run --rm lint
  lint:
    profiles: [test]
    image: ap-automation/core:test
    build:
      context: ./services/core
      target: test
    working_dir: /repo
    network_mode: none
    entrypoint: ["mypy"]
    volumes:
      - .:/repo:ro

  core-test:
    profiles: [test]
    build:
      context: ./services/core
      target: test
    image: ap-automation/core:test
    working_dir: /app
    environment:
      AP_DATABASE_URL: postgresql://unused@localhost/unused
      CORE_API_TOKEN: test-token
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      # Integration tests rebuild the ap schema in this separate database, never in the real one
      AP_TEST_DATABASE_URL: postgresql://${AP_DB_USER}:${AP_DB_PASSWORD}@postgres:5432/ap_test
    volumes:
      - ./services/core:/app
      - ./db/migrations:/migrations:ro
      - ./test-data:/test-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    networks: [backend]

volumes:
  # Postgres 17 data (upgraded from 16 by dump/restore on 2026-11-22; the old pg_data
  # volume is kept outside compose as a fallback until it is deleted by hand)
  pg17_data:
    # External: created once with `docker volume create ap-automation_pg17_data`, so that
    # `docker compose down -v` can never delete the database by accident
    external: true
    name: ap-automation_pg17_data
  n8n_data:
  ap_files:

networks:
  backend:
